<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Básico -->
    <title>Wandersites | Diseño Web para Alojamientos y Negocios</title>
    <meta
      name="description"
      content="Diseñamos páginas web modernas para alojamientos turísticos, cabañas, hoteles y negocios. Landing pages, formularios y Web Check-in online."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://wandersites.com/" />
    <meta name="author" content="Wandersites" />

    <!-- Open Graph / Redes Sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Wandersites" />
    <meta property="og:url" content="https://wandersites.com/" />
    <meta property="og:title" content="Wandersites | Diseño Web para Alojamientos y Negocios" />
    <meta
      property="og:description"
      content="Diseñamos páginas web modernas para alojamientos turísticos, cabañas, hoteles y negocios. Landing pages, formularios y Web Check-in online."
    />
    <meta property="og:image" content="https://wandersites.com/images/logo-wandersites.webp" />
    <meta property="og:image:alt" content="Logotipo de Wandersites Diseño Web" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wandersites | Diseño Web para Alojamientos y Negocios" />
    <meta
      name="twitter:description"
      content="Diseñamos páginas web modernas para alojamientos turísticos, cabañas, hoteles y negocios. Landing pages, formularios y Web Check-in online."
    />
    <meta name="twitter:image" content="https://wandersites.com/images/logo-wandersites.webp" />

    <!-- Favicon e iconos -->
    <link rel="icon" type="image/webp" href="/images/logo-wandersites.webp" />
    <link rel="apple-touch-icon" href="/images/logo-wandersites.webp" />

    <!-- Precarga de imagen crítica LCP (Hero) -->
    <link rel="preload" as="image" href="/images/somosnomadesmockup.webp" type="image/webp" fetchpriority="high" />

    <!-- Fuentes de Google pre-conectadas con display=swap (pesos optimizados en uso) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Datos estructurados Schema.org (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://wandersites.com/#website",
          "url": "https://wandersites.com/",
          "name": "Wandersites",
          "description": "Diseño web para alojamientos turísticos, cabañas, hoteles y pequeños negocios.",
          "inLanguage": "es-AR"
        },
        {
          "@type": "ProfessionalService",
          "@id": "https://wandersites.com/#organization",
          "name": "Wandersites",
          "url": "https://wandersites.com/",
          "logo": "https://wandersites.com/images/logo-wandersites.webp",
          "image": "https://wandersites.com/images/logo-wandersites.webp",
          "description": "Servicios profesionales de diseño web, landing pages y sistemas de Web Check-in para alojamientos y negocios en Argentina.",
          "email": "wandersites23@gmail.com",
          "areaServed": [
            {
              "@type": "Country",
              "name": "Argentina"
            }
          ],
          "knowsAbout": [
            "Diseño web para alojamientos turísticos",
            "Páginas web para cabañas y departamentos",
            "Web Check-in online",
            "Landing pages para pequeños negocios",
            "Integración de reservas por WhatsApp"
          ],
          "sameAs": [
            "https://instagram.com/wandersites.web"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
